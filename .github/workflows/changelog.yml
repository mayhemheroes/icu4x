name: Changelog Check
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
    - name: Check for Changelog section
      shell: python
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: "import os\nimport sys\nimport re\n\nbody = os.environ.get(\"PR_BODY\"\
        , \"\")\n\n# Remove HTML comments\nbody = re.sub(r'<!--.*?-->', '', body,\
        \ flags=re.DOTALL)\n\n# Find # Changelog section header (case-insensitive)\n\
        header_match = re.search(r'^##\\s*Changelog\\b(.*?)$', body, re.IGNORECASE\
        \ | re.MULTILINE)\n\nif not header_match:\n    print(\"::error::No '## Changelog'\
        \ section found in the PR description.\")\n    print(\"Please add a '## Changelog'\
        \ section to your PR body.\")\n    sys.exit(1)\n\nheader_suffix = header_match.group(1).strip()\n\
        \n# Check for escape hatches in the header line\n# Allow: # Changelog (N/A),\
        \ # Changelog: N/A, # Changelog: TBD, etc.\nif re.search(r'\\(N/A\\)|:\\s*N/A|:\\\
        s*TBD', header_suffix, re.IGNORECASE):\n    print(\"Changelog check passed\
        \ (opted out or deferred via header).\")\n    sys.exit(0)\n\n# Extract content\
        \ after the header until the next header or end of string\ncontent_start =\
        \ header_match.end()\n# We look for the next header by looking for '^#+\\\
        s+' after a newline\nnext_header_match = re.search(r'\\n#+\\s+', body[content_start:])\n\
        if next_header_match:\n    content = body[content_start:content_start + next_header_match.start()]\n\
        else:\n    content = body[content_start:]\n\ncontent = content.strip()\n\n\
        # Also check if the content itself starts with N/A or TBD\nif re.match(r'^(N/A|TBD)\\\
        b', content, re.IGNORECASE):\n    print(\"Changelog check passed (opted out\
        \ or deferred in content).\")\n    sys.exit(0)\n\nif not content:\n    print(\"\
        ::error::The '## Changelog' section is empty.\")\n    print(\"Please provide\
        \ a changelog entry, or use '## Changelog (N/A)' or '## Changelog: TBD' if\
        \ appropriate.\")\n    sys.exit(1)\n\nprint(\"Changelog check passed.\")\n"
'on':
  merge_group: null
