name: Build and Test
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        behavior:
        - check
        - features-1
        - features-2
        - features-3
        - features-4
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Install cargo-all-features
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-all-features@1.12.0
    - name: Set MSRV toolchain
      run: rustup override set 1.86
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Check
      run: cargo make ci-job-${{ matrix.behavior }}
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Run `cargo make ci-job-test`
      run: cargo make ci-job-test
  test-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Run `cargo make ci-job-test-docs`
      run: cargo make ci-job-test-docs
  test-gigo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Run `cargo make ci-job-test-gigo`
      run: cargo make ci-job-test-gigo
  test-cargo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Install harfbuzz
      run: 'sudo apt update

        sudo apt install libharfbuzz-dev

        '
    - name: Run `cargo make ci-job-test-cargo`
      run: cargo make ci-job-test-cargo
  testdata:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Install rustfmt
      run: rustup component add rustfmt
    - name: Run `cargo make ci-job-testdata`
      run: cargo make ci-job-testdata
  full-datagen:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Install rustfmt
      run: rustup component add rustfmt
    - name: Run `cargo make ci-job-full-datagen`
      run: cargo make ci-job-full-datagen
  test-c:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Install LLD and Clang
      run: sudo apt-get install lld-19 clang-19
    - name: Run `cargo make ci-job-test-c`
      run: cargo make ci-job-test-c
      env:
        CXX: g++-13
    - name: Test C++ with clang
      run: cargo make test-cpp
      env:
        CXX: clang++
  test-js:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Install LLD
      run: sudo apt-get install lld-19
    - name: Run `cargo make ci-job-test-js`
      run: cargo make ci-job-test-js
  test-dart:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - uses: dart-lang/setup-dart@0a8a0fc875eb934c15d08629302413c671d3f672
      with:
        sdk: 3.11.0-46.0.dev
    - name: Install yq if Windows
      if: ${{ matrix.os == 'windows-latest' }}
      run: choco install yq
    - name: Run `cargo make ci-job-test-dart`
      shell: bash
      run: 'export PATH=$PATH:/c/Program\ Files/Git/bin # make bash available on Windows

        cargo make ci-job-test-dart

        '
    - name: Run `cargo make ci-job-test-dart` in local mode
      run: 'cp ffi/dart/.dart_tool/lib/* dylib

        git clean -xf ffi examples

        yq -i ".hooks.user_defines.icu4x.buildMode = \"local\"" ffi/dart/pubspec.yaml

        yq -i ".hooks.user_defines.icu4x.localPath = \"file://$(realpath dylib)\""
        ffi/dart/pubspec.yaml

        yq -i ".hooks.user_defines.icu4x.buildMode = \"local\"" examples/dart/pubspec.yaml

        yq -i ".hooks.user_defines.icu4x.localPath = \"file://$(realpath dylib)\""
        examples/dart/pubspec.yaml

        cargo make ci-job-test-dart

        rm dylib

        '
    - name: Run `cargo make ci-job-test-dart` in fetch mode
      run: 'git clean -xf ffi examples

        yq -i ".hooks.user_defines.icu4x.buildMode = \"fetch\"" ffi/dart/pubspec.yaml

        yq -i ".hooks.user_defines.icu4x.buildMode = \"fetch\"" examples/dart/pubspec.yaml

        cargo make ci-job-test-dart

        '
  test-kotlin:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Setup Maven Action
      uses: s4u/setup-maven-action@v1.19.0
    - name: Maven version
      run: mvn -version
    - name: Run `cargo make ci-job-test-kotlin`
      run: cargo make ci-job-test-kotlin
  nostd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Run `cargo make ci-job-nostd`
      run: cargo make ci-job-nostd
  diplomat:
    runs-on:
    - ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Run `cargo make ci-job-diplomat`
      run: cargo make ci-job-diplomat
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Install rustfmt
      run: rustup component add rustfmt
    - name: Check Format
      run: cargo make ci-job-fmt
  tidy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Tidy
      run: cargo make ci-job-tidy
  clippy:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Install clippy
      run: rustup component add clippy
    - name: Run `ci-job-clippy`
      run: cargo make ci-job-clippy
  doc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install cargo-make
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: cargo-make@0.37.13
    - name: Potentially override rust version with nightly
      run: cargo make set-ci-toolchain
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Cargo doc
      run: cargo make ci-job-doc
  semver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Fetch base_ref if needed
      if: ${{ github.event_name == 'pull_request' }}
      run: git fetch origin ${{ github.base_ref }}
    - name: Show the selected Rust toolchain
      run: rustup show
    - name: Check semver
      uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae
      if: ${{ github.event_name == 'pull_request' }}
      with:
        baseline-rev: origin/${{ github.base_ref }}
        rust-toolchain: manual
    - name: Show semver violations since last release
      uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae
      with:
        rust-toolchain: manual
      if: ${{ github.event_name != 'pull_request' }}
      continue-on-error: true
  notify-slack:
    needs:
    - msrv
    - test
    - testdata
    - test-docs
    - full-datagen
    - test-c
    - test-js
    - test-dart
    - nostd
    - diplomat
    - fmt
    - tidy
    - clippy
    - doc
    if: ${{ always() && contains(needs.*.result, 'failure') && (github.event_name
      == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name
      == 'push' && github.ref_name == 'main')) }}
    runs-on: ubuntu-latest
    steps:
    - name: Notify slack of failure
      uses: ravsamhq/notify-slack-action@4ed28566c2bdcdaee6dca2b46b9666d01b4ed8a4
      with:
        notify_when: failure
        status: failure
        notification_title: ''
        message_format: ${{ format('{{emoji}} {0} CI failed!' , (github.event_name
          == 'push' && 'Main' || (github.event.schedule == '1 14 * * *' && 'Beta'
          || 'Nightly'))) }}
        footer: <{run_url}|View failure> | <https://github.com/unicode-org/icu4x/actions?query=event%3A${{
          github.event_name }}|CI history for `${{ github.event_name }}`>
      env:
        SLACK_WEBHOOK_URL: ${{ ((github.event_name == 'schedule' && github.event.schedule
          == '1 14 * * *') || github.event_name == 'push') && secrets.SLACK_WEBHOOK_URL
          || secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        default: nightly
        type: choice
        options:
        - pinned-stable
        - stable
        - beta
        - nightly
  schedule:
  - cron: 0 14 * * *
  - cron: 1 14 * * *
