name: Coverage
permissions:
  contents: read
jobs:
  test:
    if: false
    name: Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    - name: Install grcov
      uses: taiki-e/install-action@64e4e2f995104968c78bd697b253d55bf557af66
      with:
        tool: grcov
    - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af
      with:
        toolchain: nightly-2025-09-01
        override: true
    - run: cargo test --all-features --no-fail-fast
      env:
        CARGO_INCREMENTAL: '0'
        RUSTFLAGS: -Zprofile -Ccodegen-units=1 -Cinline-threshold=0 -Clink-dead-code
          -Coverflow-checks=off -Zpanic_abort_tests
        RUSTDOCFLAGS: -Zprofile -Ccodegen-units=1 -Cinline-threshold=0 -Clink-dead-code
          -Coverflow-checks=off -Zpanic_abort_tests
    - id: coverage
      uses: actions-rs/grcov@770fa904bcbfc50da498080d1511da7388e6ddc6
    - name: Push grcov results to Coveralls via GitHub Action
      uses: coverallsapp/github-action@95b1a2355bd0e526ad2fd62da9fd386ad4c98474
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ steps.coverage.outputs.report }}
    - name: Push grcov results to Codecov via GitHub Action
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
      if: false
      with:
        file: ${{ steps.coverage.outputs.report }}
        fail_ci_if_error: true
'on':
  workflow_dispatch: null
